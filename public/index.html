<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Survival</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #0d130d;
    color: #eef3ea;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  #game { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; top: 14px; left: 14px; z-index: 10; display: grid; gap: 8px; }
  .panel {
    background: rgba(10,16,10,.55);
    -webkit-backdrop-filter: blur(7px);
    backdrop-filter: blur(7px);
    border: 1px solid rgba(255,255,255,.09);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    line-height: 1.55;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
    min-width: 190px;
  }
  .panel .big { font-size: 20px; font-weight: 700; }
  .panel b { color: #ffd479; }
  .row { display: flex; justify-content: space-between; gap: 16px; }
  .muted { opacity: .6; font-size: 12px; }
  kbd {
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18);
    border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font-size: 11px;
    font-family: inherit;
  }
</style>
</head>
<body>
<div id="hud">
  <div class="panel" id="stats">Connecting…</div>
  <div class="panel muted">
    <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move &nbsp;·&nbsp; click a tree to chop</div>
  </div>
</div>
<canvas id="game"></canvas>

<script src="https://unpkg.com/colyseus.js@0.15.17/dist/colyseus.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from "three";

"use strict";

// The simulation keeps using the original 2D top-down coordinates (x, y) with
// the world spanning W x H. We map that plane onto the XZ plane of the 3D
// scene (scene.x = world x, scene.z = world y) and look straight down at it.
const W = 1000;
const H = 700;
const WORLD_CX = W / 2;
const WORLD_CZ = H / 2;

const canvas = document.getElementById("game");
const statsEl = document.getElementById("stats");

// ---------------------------------------------------------------- utilities
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

// ------------------------------------------------------------- three.js setup
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a1a10);
scene.fog = new THREE.Fog(0x0a1a10, 900, 1900);

const camera = new THREE.PerspectiveCamera(42, 1, 1, 4000);

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);

// Sun follows the player so its shadow frustum always covers what we can see.
const sun = new THREE.DirectionalLight(0xfff2cf, 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 900;
sun.shadow.camera.left = -280;
sun.shadow.camera.right = 280;
sun.shadow.camera.top = 280;
sun.shadow.camera.bottom = -280;
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.6;
scene.add(sun);
scene.add(sun.target);

const hemi = new THREE.HemisphereLight(0xbcd8ff, 0x2c3a20, 0.9);
scene.add(hemi);

// ------------------------------------------------------------------- ground
const groundMat = new THREE.MeshStandardMaterial({ map: makeGroundTexture(), roughness: 1, metalness: 0 });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(W + 400, H + 400), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.set(WORLD_CX, 0, WORLD_CZ);
ground.receiveShadow = true;
scene.add(ground);

// Scattered detail (rocks / grass tufts) baked as sprites so they read well
// from directly above without the cost of hundreds of meshes.
const detailMat = new THREE.MeshBasicMaterial({
  map: makeDetailTexture(),
  transparent: true,
  alphaTest: 0.35,
  depthWrite: false,
});
const detail = new THREE.Mesh(new THREE.PlaneGeometry(W + 120, H + 120), detailMat);
detail.rotation.x = -Math.PI / 2;
detail.position.set(WORLD_CX, 0.02, WORLD_CZ);
detail.renderOrder = 1;
scene.add(detail);

function makeGroundTexture() {
  const c = document.createElement("canvas");
  c.width = 1024; c.height = 768;
  const g = c.getContext("2d");
  const rnd = mulberry32(1337);

  const base = g.createLinearGradient(0, 0, 0, c.height);
  base.addColorStop(0, "#4f7a3a");
  base.addColorStop(0.5, "#456d33");
  base.addColorStop(1, "#3a5c2b");
  g.fillStyle = base;
  g.fillRect(0, 0, c.width, c.height);

  // Mottled grass patches
  for (let i = 0; i < 260; i++) {
    const x = rnd() * c.width, y = rnd() * c.height;
    const r = 30 + rnd() * 110;
    const shade = rnd();
    const col = shade < 0.4 ? "63,102,45" : shade < 0.75 ? "84,124,58" : "52,84,40";
    const grad = g.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, `rgba(${col},${0.18 + rnd() * 0.16})`);
    grad.addColorStop(1, `rgba(${col},0)`);
    g.fillStyle = grad;
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }

  // Dirt clearings
  for (let i = 0; i < 7; i++) {
    const x = rnd() * c.width, y = rnd() * c.height, r = 40 + rnd() * 70;
    const grad = g.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, "rgba(96,72,44,0.55)");
    grad.addColorStop(0.7, "rgba(96,72,44,0.25)");
    grad.addColorStop(1, "rgba(96,72,44,0)");
    g.fillStyle = grad;
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

function makeDetailTexture() {
  const c = document.createElement("canvas");
  c.width = 1024; c.height = 768;
  const g = c.getContext("2d");
  const rnd = mulberry32(4242);

  // Rocks
  for (let i = 0; i < 40; i++) {
    const x = rnd() * c.width, y = rnd() * c.height, r = 3 + rnd() * 6;
    g.fillStyle = "rgba(0,0,0,0.22)";
    g.beginPath(); g.ellipse(x + 1.5, y + 2, r, r * 0.6, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#8a8f86";
    g.beginPath(); g.ellipse(x, y, r, r * 0.7, rnd(), 0, Math.PI * 2); g.fill();
    g.fillStyle = "rgba(255,255,255,0.25)";
    g.beginPath(); g.ellipse(x - r * 0.3, y - r * 0.3, r * 0.4, r * 0.25, 0, 0, Math.PI * 2); g.fill();
  }

  // Grass tufts
  for (let i = 0; i < 1400; i++) {
    const x = rnd() * c.width, y = rnd() * c.height;
    const h = 4 + rnd() * 7;
    const lean = (rnd() - 0.5) * 4;
    g.strokeStyle = rnd() < 0.5 ? "rgba(120,170,80,0.5)" : "rgba(70,110,50,0.55)";
    g.lineWidth = 1;
    g.beginPath();
    g.moveTo(x, y);
    g.quadraticCurveTo(x + lean * 0.5, y - h * 0.6, x + lean, y - h);
    g.stroke();
  }

  // Wildflowers
  for (let i = 0; i < 120; i++) {
    const x = rnd() * c.width, y = rnd() * c.height;
    const col = ["#e8d15a", "#e88fb0", "#dfe6ea", "#c98fe8"][(rnd() * 4) | 0];
    g.fillStyle = col;
    g.beginPath(); g.arc(x, y, 1.6, 0, Math.PI * 2); g.fill();
  }

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

// --------------------------------------------------------------- tree meshes
const treeGroup = new THREE.Group();
scene.add(treeGroup);
const treeMeshes = new Map(); // id -> THREE.Group

const trunkGeo = new THREE.CylinderGeometry(0.62, 0.95, 1, 7);
const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6b4526, roughness: 0.95, flatShading: true });
const pineGeo = new THREE.ConeGeometry(1, 1, 8);
const blobGeo = new THREE.IcosahedronGeometry(1, 0);

function makeTree(id) {
  const rnd = mulberry32(hashStr(id));
  const pine = rnd() < 0.45;
  const group = new THREE.Group();
  const trunkH = pine ? 9 + rnd() * 4 : 7 + rnd() * 4;
  const trunkR = 0.9 + rnd() * 0.5;

  const trunk = new THREE.Mesh(trunkGeo, trunkMat);
  trunk.scale.set(trunkR, trunkH, trunkR);
  trunk.position.y = trunkH / 2;
  trunk.castShadow = true;
  trunk.receiveShadow = true;
  group.add(trunk);

  if (pine) {
    const tiers = 3;
    for (let i = 0; i < tiers; i++) {
      const r = (7.5 - i * 1.8) * (0.85 + rnd() * 0.25);
      const h = 8 + rnd() * 2.5;
      const mat = new THREE.MeshStandardMaterial({
        color: new THREE.Color().setHSL(0.30 + rnd() * 0.03, 0.45 + rnd() * 0.12, 0.20 + rnd() * 0.07),
        roughness: 1,
        flatShading: true,
      });
      const cone = new THREE.Mesh(pineGeo, mat);
      cone.scale.set(r, h, r);
      cone.position.y = trunkH * 0.7 + i * (h * 0.55);
      cone.castShadow = true;
      group.add(cone);
    }
  } else {
    const n = 5;
    const canopyBase = trunkH + 4;
    for (let i = 0; i < n; i++) {
      const r = 4 + rnd() * 3;
      const mat = new THREE.MeshStandardMaterial({
        color: new THREE.Color().setHSL(0.24 + rnd() * 0.05, 0.42 + rnd() * 0.16, 0.26 + rnd() * 0.1),
        roughness: 1,
        flatShading: true,
      });
      const blob = new THREE.Mesh(blobGeo, mat);
      blob.scale.setScalar(r);
      blob.position.set(
        (rnd() - 0.5) * 8,
        canopyBase + (rnd() - 0.5) * 5,
        (rnd() - 0.5) * 8
      );
      blob.castShadow = true;
      group.add(blob);
    }
  }

  group.rotation.y = rnd() * Math.PI * 2;
  return group;
}

function syncTrees(state, time) {
  const seen = new Set();
  state.trees.forEach((tree, id) => {
    seen.add(id);
    let mesh = treeMeshes.get(id);
    if (!mesh) {
      mesh = makeTree(id);
      mesh.position.set(tree.x, 0, tree.y);
      mesh.userData.treeId = id;
      treeMeshes.set(id, mesh);
      treeGroup.add(mesh);
    }
    // Gentle sway, mirroring the original animation.
    mesh.rotation.z = Math.sin(time * 0.9 + tree.x * 0.05) * 0.02;
  });
  for (const [id, mesh] of treeMeshes) {
    if (!seen.has(id)) {
      treeGroup.remove(mesh);
      disposeGroup(mesh);
      treeMeshes.delete(id);
    }
  }
}

function disposeGroup(group) {
  group.traverse((o) => {
    if (o.isMesh) {
      if (o.geometry !== trunkGeo && o.geometry !== pineGeo && o.geometry !== blobGeo) o.geometry.dispose();
      if (Array.isArray(o.material)) o.material.forEach((m) => m.dispose());
      else if (o.material) o.material.dispose();
    }
  });
}

// -------------------------------------------------------------- player meshes
const playerGroup = new THREE.Group();
scene.add(playerGroup);
const players = new Map(); // id -> { group, torso, legL, legR, armL, armR, woodLabel, phase, facing, px, py, moving }

const ME_COLORS = { shirt: 0x4a90d9, shirtDark: 0x2f6699, hair: 0x3a2a1a };
const OTHER_COLORS = { shirt: 0xd9704a, shirtDark: 0xa04d2e, hair: 0x241a12 };

const legGeo = new THREE.CylinderGeometry(1, 1, 1, 6);
const armGeo = new THREE.CylinderGeometry(1, 1, 1, 6);
const torsoGeo = new THREE.CylinderGeometry(5.2, 4.4, 10, 10);
const headGeo = new THREE.SphereGeometry(3.6, 14, 12);
const noseGeo = new THREE.ConeGeometry(0.9, 2.2, 8);
const hairGeo = new THREE.SphereGeometry(3.9, 14, 10, 0, Math.PI * 2, 0, Math.PI * 0.62);

function makeWoodLabel() {
  const c = document.createElement("canvas");
  c.width = 256; c.height = 64;
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  sprite.scale.set(20, 5, 1);
  sprite.position.y = 25;
  sprite.renderOrder = 999;
  return { sprite, canvas: c, tex, value: null };
}

function paintWoodLabel(label, value) {
  if (label.value === value) return;
  label.value = value;
  const g = label.canvas.getContext("2d");
  g.clearRect(0, 0, 256, 64);
  g.fillStyle = "rgba(0,0,0,0.55)";
  g.beginPath();
  if (g.roundRect) g.roundRect(28, 8, 200, 48, 16);
  else g.rect(28, 8, 200, 48);
  g.fill();
  g.fillStyle = "#fff";
  g.font = "bold 34px ui-sans-serif, system-ui, sans-serif";
  g.textAlign = "center";
  g.textBaseline = "middle";
  g.fillText(`\u{1FAB5} ${value}`, 128, 33);
  label.tex.needsUpdate = true;
}

function makePlayer(isMe) {
  const c = isMe ? ME_COLORS : OTHER_COLORS;
  const group = new THREE.Group();
  const skinMat = new THREE.MeshStandardMaterial({ color: 0xe8b98a, roughness: 0.85 });
  const legMat = new THREE.MeshStandardMaterial({ color: 0x33414f, roughness: 0.9 });
  const torsoMat = new THREE.MeshStandardMaterial({ color: c.shirt, roughness: 0.8 });
  const armMat = new THREE.MeshStandardMaterial({ color: c.shirtDark, roughness: 0.85 });
  const hairMat = new THREE.MeshStandardMaterial({ color: c.hair, roughness: 1 });

  const torso = new THREE.Mesh(torsoGeo, torsoMat);
  torso.position.y = 12.5;
  torso.castShadow = true;
  group.add(torso);

  const head = new THREE.Mesh(headGeo, skinMat);
  head.position.y = 20;
  head.castShadow = true;
  group.add(head);

  const hair = new THREE.Mesh(hairGeo, hairMat);
  hair.position.set(0, 20.6, -0.4);
  hair.rotation.x = -Math.PI / 2;
  group.add(hair);

  const nose = new THREE.Mesh(noseGeo, skinMat);
  nose.rotation.x = Math.PI / 2;
  nose.position.set(0, 19.8, 3.4);
  group.add(nose);

  function limb(x, y, z, w, len, mat) {
    const pivot = new THREE.Group();
    pivot.position.set(x, y, z);
    const m = new THREE.Mesh(armGeo, mat);
    m.scale.set(w, len, w);
    m.position.y = -len / 2;
    m.castShadow = true;
    pivot.add(m);
    group.add(pivot);
    return pivot;
  }
  const legL = limb(-2.4, 8, 0, 1.7, 8, legMat);
  const legR = limb(2.4, 8, 0, 1.7, 8, legMat);
  const armL = limb(-5.6, 17, 0, 1.5, 7.5, armMat);
  const armR = limb(5.6, 17, 0, 1.5, 7.5, armMat);

  const woodLabel = makeWoodLabel();
  group.add(woodLabel.sprite);

  return { group, torso, legL, legR, armL, armR, woodLabel, phase: 0, facing: 0, px: null, py: null, moving: false, isMe };
}

// ------------------------------------------------------------ fx particles
const particles = [];
const particleGeo = new THREE.BoxGeometry(1, 1, 1);
const floaterGroup = new THREE.Group();
scene.add(floaterGroup);

function spawnHarvestFx(x, y) {
  for (let i = 0; i < 18; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 30 + Math.random() * 90;
    const leaf = Math.random() < 0.6;
    const color = leaf
      ? new THREE.Color().setHSL(0.25 + Math.random() * 0.11, 0.6, 0.3 + Math.random() * 0.2)
      : new THREE.Color(0x7a5230);
    const mat = new THREE.MeshBasicMaterial({ color });
    const mesh = new THREE.Mesh(particleGeo, mat);
    const size = 2 + Math.random() * 3;
    mesh.scale.setScalar(size);
    mesh.position.set(x, 12, y);
    scene.add(mesh);
    particles.push({
      mesh, mat,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40, vz: 30 + Math.random() * 80,
      life: 0.7 + Math.random() * 0.6, max: 1.3,
      rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 8,
    });
  }

  const c = document.createElement("canvas");
  c.width = 256; c.height = 96;
  const g = c.getContext("2d");
  g.font = "bold 44px ui-sans-serif, system-ui, sans-serif";
  g.textAlign = "center";
  g.textBaseline = "middle";
  g.lineWidth = 8;
  g.strokeStyle = "rgba(0,0,0,0.6)";
  g.fillStyle = "#ffe08a";
  g.strokeText("+1 \u{1FAB5}", 128, 48);
  g.fillText("+1 \u{1FAB5}", 128, 48);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(26, 9.75, 1);
  sprite.position.set(x, 30, y);
  sprite.renderOrder = 998;
  floaterGroup.add(sprite);
  floaters.push({ sprite, mat, tex, life: 1.1, max: 1.1 });
}

const floaters = [];
function updateFx(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) {
      scene.remove(p.mesh);
      p.mat.dispose();
      particles.splice(i, 1);
      continue;
    }
    p.vz += 220 * dt;
    p.mesh.position.x += p.vx * dt;
    p.mesh.position.y += p.vy * dt;
    p.mesh.position.z += p.vz * dt;
    p.mesh.position.y = Math.max(0.5, p.mesh.position.y);
    p.vx *= 0.98;
    p.mesh.rotation.x = p.rot += p.vr * dt;
    p.mat.opacity = clamp(p.life / p.max, 0, 1);
    p.mat.transparent = true;
  }
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.life -= dt;
    if (f.life <= 0) {
      floaterGroup.remove(f.sprite);
      f.mat.dispose();
      f.tex.dispose();
      floaters.splice(i, 1);
      continue;
    }
    f.sprite.position.y += 22 * dt;
    f.mat.opacity = clamp(f.life / f.max, 0, 1);
  }
}

// ------------------------------------------------------------------- input
const keys = {};
addEventListener("keydown", (e) => { keys[e.key.toLowerCase()] = true; });
addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });

let local = { x: 500, y: 350 };
let facing = 0;          // radians, 0 = facing +x in world space
let walkPhase = 0;
let room = null;
let myId = null;
let connected = false;

canvas.addEventListener("click", (e) => {
  if (!room || !room.state) return;
  const ndc = new THREE.Vector2(
    (e.clientX / window.innerWidth) * 2 - 1,
    -(e.clientY / window.innerHeight) * 2 + 1
  );
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects([...treeMeshes.values()], true);
  if (!hits.length) return;
  let o = hits[0].object;
  while (o && !o.userData.treeId) o = o.parent;
  const treeId = o ? o.userData.treeId : null;
  if (!treeId) return;
  const tree = room.state.trees.get(treeId);
  if (!tree) return;
  if (Math.hypot(tree.x - local.x, tree.y - local.y) <= 60) {
    room.send("harvest", { treeId });
  }
});

const raycaster = new THREE.Raycaster();

// ------------------------------------------------------------------ network
const proto = location.protocol === "https:" ? "wss" : "ws";
const endpoint = `${proto}://${location.host}`;
const client = new Colyseus.Client(endpoint);

async function connect() {
  try {
    room = await client.joinOrCreate("survival");
    myId = room.sessionId;
    connected = true;
    room.onStateChange.once((state) => {
      const me = state.players.get(myId);
      if (me) { local.x = me.x; local.y = me.y; }
    });
    room.onLeave(() => { connected = false; });
    setInterval(() => { if (room) room.send("move", { x: local.x, y: local.y }); }, 50);
  } catch (err) {
    console.error(err);
    statsEl.textContent = "Connection failed — see console";
  }
}

// --------------------------------------------------------------------- loop
const startTime = performance.now();
const DAY_LENGTH = 180000; // 3 minutes
const clock = new THREE.Clock();

// A day/night tint blended over the whole scene each frame.
const skyTint = new THREE.Mesh(
  new THREE.PlaneGeometry(6000, 6000),
  new THREE.MeshBasicMaterial({ color: 0x0c1834, transparent: true, opacity: 0, depthWrite: false })
);
skyTint.rotation.x = -Math.PI / 2;
skyTint.position.y = 60;
skyTint.renderOrder = 500;
scene.add(skyTint);

const sunDay = new THREE.Color(0xfff2cf);
const sunDusk = new THREE.Color(0xffa860);
const sunNight = new THREE.Color(0x5a6ea8);

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());
  const now = performance.now();
  const time = (now - startTime) / 1000;
  const tOfDay = (((now - startTime) / DAY_LENGTH) + 0.35) % 1;

  // ---- movement ----
  const speed = 170; // world units/sec
  let dx = 0, dy = 0;
  if (keys["w"] || keys["arrowup"]) dy -= 1;
  if (keys["s"] || keys["arrowdown"]) dy += 1;
  if (keys["a"] || keys["arrowleft"]) dx -= 1;
  if (keys["d"] || keys["arrowright"]) dx += 1;
  const moving = dx !== 0 || dy !== 0;
  if (moving) {
    const len = Math.hypot(dx, dy);
    dx /= len; dy /= len;
    local.x = clamp(local.x + dx * speed * dt, 20, W - 20);
    local.y = clamp(local.y + dy * speed * dt, 20, H - 20);
    facing = Math.atan2(dy, dx);
    walkPhase += dt * 11;
  }

  // ---- day / night lighting ----
  const s = Math.sin(tOfDay * Math.PI * 2 - Math.PI / 2); // -1 midnight, +1 noon
  const dayAmt = clamp((s + 0.15) / 0.9, 0, 1);
  const night = 1 - dayAmt;
  const warmth = 1 - Math.abs(s);

  sun.intensity = 0.25 + dayAmt * 2.6;
  sun.color.copy(sunNight).lerp(sunDay, dayAmt);
  if (warmth > 0.1) sun.color.lerp(sunDusk, warmth * 0.5);
  hemi.intensity = 0.25 + dayAmt * 0.85;

  scene.background.setRGB(
    0.04 + dayAmt * 0.24,
    0.10 + dayAmt * 0.34,
    0.06 + dayAmt * 0.22
  );
  scene.fog.color.copy(scene.background);

  // Tint overlay for night / dawn dusk
  skyTint.material.opacity = night * 0.5;
  skyTint.material.color.setRGB(0.05, 0.09, 0.20);

  // ---- camera follows player, looking straight down ----
  const camTarget = new THREE.Vector3(local.x, 0, local.y);
  const camPos = new THREE.Vector3(local.x, 760, local.y + 0.001);
  camera.position.lerp(camPos, 1 - Math.pow(0.001, dt));
  camera.lookAt(camTarget);

  // Sun + shadow frustum follow the player
  sun.position.set(local.x + 220, 480, local.y + 160);
  sun.target.position.set(local.x, 0, local.y);
  sun.target.updateMatrixWorld();
  skyTint.position.x = local.x;
  skyTint.position.z = local.y;

  // ---- world ----
  if (room && room.state) {
    syncTrees(room.state, time);

    const seen = new Set();
    room.state.players.forEach((p, id) => {
      seen.add(id);
      const isMe = id === myId;
      let a = players.get(id);
      if (!a) { a = makePlayer(isMe); playerGroup.add(a.group); players.set(id, a); }

      let px, py, f, phase, mv;
      if (isMe) {
        px = local.x; py = local.y; f = facing; phase = walkPhase; mv = moving;
      } else {
        if (a.px === null) { a.px = p.x; a.py = p.y; }
        const moved = Math.hypot(p.x - a.px, p.y - a.py) > 0.4;
        if (moved) { a.facing = Math.atan2(p.y - a.py, p.x - a.px); a.phase += dt * 11; }
        a.moving = moved; a.px = p.x; a.py = p.y;
        px = p.x; py = p.y; f = a.facing; phase = a.phase; mv = a.moving;
      }

      a.group.position.set(px, 0, py);
      // World +x is scene +x; world +y is scene +z. The model faces scene +z,
      // so rotate so it points along the movement direction.
      a.group.rotation.y = Math.PI / 2 - f;

      const swing = mv ? Math.sin(phase) * 0.7 : 0;
      a.legL.rotation.x = swing;
      a.legR.rotation.x = -swing;
      a.armL.rotation.x = -swing * 0.8;
      a.armR.rotation.x = swing * 0.8;

      paintWoodLabel(a.woodLabel, p.wood);
      a.woodLabel.sprite.visible = true;
    });

    for (const [id, a] of players) {
      if (!seen.has(id)) {
        playerGroup.remove(a.group);
        disposeGroup(a.group);
        players.delete(id);
      }
    }
  } else {
    // Not connected yet: show the local survivor so the screen isn't empty.
    let a = players.get("__local__");
    if (!a) { a = makePlayer(true); playerGroup.add(a.group); players.set("__local__", a); }
    a.group.position.set(local.x, 0, local.y);
    a.group.rotation.y = Math.PI / 2 - facing;
    a.woodLabel.sprite.visible = false;
  }

  updateFx(dt);
  renderer.render(scene, camera);

  // ---- HUD ----
  if (connected && room && room.state) {
    const me = room.state.players.get(myId);
    const hours = Math.floor(tOfDay * 24);
    const mins = Math.floor((tOfDay * 24 * 60) % 60);
    const phaseName = tOfDay < 0.25 ? "\u{1F305} Dawn" : tOfDay < 0.5 ? "\u2600\uFE0F Day" : tOfDay < 0.75 ? "\u{1F307} Dusk" : "\u{1F319} Night";
    statsEl.innerHTML =
      `<div class="big">\u{1FAB5} ${me ? me.wood : 0} wood</div>` +
      `<div class="row"><span class="muted">Survivors</span><span><b>${room.state.players.size}</b></span></div>` +
      `<div class="row"><span class="muted">Trees left</span><span><b>${room.state.trees.size}</b></span></div>` +
      `<div class="row"><span class="muted">${phaseName}</span><span>${String(hours).padStart(2, "0")}:${String(mins).padStart(2, "0")}</span></div>`;
  }
}

resize();
animate();
connect();
</script>
</body>
</html>
