<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Survival</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #0d130d;
    color: #eef3ea;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  #game { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; top: 14px; left: 14px; z-index: 10; display: grid; gap: 8px; }
  .panel {
    background: rgba(10,16,10,.55);
    -webkit-backdrop-filter: blur(7px);
    backdrop-filter: blur(7px);
    border: 1px solid rgba(255,255,255,.09);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    line-height: 1.55;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
    min-width: 190px;
  }
  .panel .big { font-size: 20px; font-weight: 700; }
  .panel b { color: #ffd479; }
  .row { display: flex; justify-content: space-between; gap: 16px; }
  .muted { opacity: .6; font-size: 12px; }
  kbd {
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18);
    border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font-size: 11px;
    font-family: inherit;
  }
  .vital { margin-bottom: 7px; }
  .vital:last-child { margin-bottom: 0; }
  .vital .row { font-size: 12px; }
  .bar { height: 9px; margin-top: 3px; border-radius: 6px; background: rgba(255,255,255,.12); overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 100%; transition: width .15s linear; }
  #notice {
    position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%);
    z-index: 12; background: rgba(20,10,10,.85); border: 1px solid rgba(255,180,120,.35);
    color: #ffd9a8; padding: 8px 16px; border-radius: 8px; font-size: 14px;
    opacity: 0; pointer-events: none; transition: opacity .3s;
  }
  #death {
    position: fixed; inset: 0; z-index: 20; display: none;
    align-items: center; justify-content: center; flex-direction: column; gap: 18px;
    background: rgba(20,0,0,.72); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
    text-align: center;
  }
  #death.show { display: flex; }
  #death h1 { margin: 0; font-size: 40px; letter-spacing: .04em; }
  #death p { margin: 0; opacity: .8; }
  #respawn {
    font: inherit; font-size: 16px; padding: 10px 26px; border-radius: 8px; cursor: pointer;
    border: 1px solid rgba(255,255,255,.25); background: #b6472f; color: #fff;
  }
  #respawn:hover { background: #d0563c; }
</style>
</head>
<body>
<div id="hud">
  <div class="panel" id="stats">Connecting…</div>
  <div class="panel" id="vitals"></div>
  <div class="panel" id="inv"></div>
  <div class="panel muted">
    <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move · hold <kbd>Shift</kbd> sprint</div>
    <div>click resources to gather · <kbd>F</kbd> repeat · <kbd>R</kbd> drink at pond · <kbd>E</kbd> eat · <kbd>Q</kbd> drink carried</div>
    <div><kbd>1</kbd> axe · <kbd>2</kbd> pickaxe · <kbd>3</kbd> campfire · <kbd>4</kbd> stoke fire</div>
  </div>
</div>
<div id="notice"></div>
<div id="death">
  <h1>You collapsed</h1>
  <p id="deathCause">Your body gave out.</p>
  <button id="respawn">Respawn</button>
</div>
<canvas id="game"></canvas>

<script src="https://unpkg.com/colyseus.js@0.15.17/dist/colyseus.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from "three";

"use strict";

// The simulation keeps using the original 2D top-down coordinates (x, y) with
// the world spanning W x H. We map that plane onto the XZ plane of the 3D
// scene (scene.x = world x, scene.z = world y) and look straight down at it.
const W = 1000;
const H = 700;
const WORLD_CX = W / 2;
const WORLD_CZ = H / 2;

const canvas = document.getElementById("game");
const statsEl = document.getElementById("stats");
const vitalsEl = document.getElementById("vitals");
const invEl = document.getElementById("inv");
const noticeEl = document.getElementById("notice");
const deathEl = document.getElementById("death");
const deathCauseEl = document.getElementById("deathCause");
document.getElementById("respawn").addEventListener("click", () => {
  if (room) room.send("respawn");
});

// ---------------------------------------------------------------- utilities
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

// ------------------------------------------------------------- three.js setup
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a1a10);
scene.fog = new THREE.Fog(0x0a1a10, 900, 1900);

const camera = new THREE.PerspectiveCamera(42, 1, 1, 4000);

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);

// Sun follows the player so its shadow frustum always covers what we can see.
const sun = new THREE.DirectionalLight(0xfff2cf, 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 900;
sun.shadow.camera.left = -280;
sun.shadow.camera.right = 280;
sun.shadow.camera.top = 280;
sun.shadow.camera.bottom = -280;
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.6;
scene.add(sun);
scene.add(sun.target);

const hemi = new THREE.HemisphereLight(0xbcd8ff, 0x2c3a20, 0.9);
scene.add(hemi);

// ------------------------------------------------------------------- ground
const groundMat = new THREE.MeshStandardMaterial({ map: makeGroundTexture(), roughness: 1, metalness: 0 });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(W + 400, H + 400), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.set(WORLD_CX, 0, WORLD_CZ);
ground.receiveShadow = true;
scene.add(ground);

// Scattered detail (rocks / grass tufts) baked as sprites so they read well
// from directly above without the cost of hundreds of meshes.
const detailMat = new THREE.MeshBasicMaterial({
  map: makeDetailTexture(),
  transparent: true,
  alphaTest: 0.35,
  depthWrite: false,
});
const detail = new THREE.Mesh(new THREE.PlaneGeometry(W + 120, H + 120), detailMat);
detail.rotation.x = -Math.PI / 2;
detail.position.set(WORLD_CX, 0.02, WORLD_CZ);
detail.renderOrder = 1;
scene.add(detail);

function makeGroundTexture() {
  const c = document.createElement("canvas");
  c.width = 1024; c.height = 768;
  const g = c.getContext("2d");
  const rnd = mulberry32(1337);

  const base = g.createLinearGradient(0, 0, 0, c.height);
  base.addColorStop(0, "#4f7a3a");
  base.addColorStop(0.5, "#456d33");
  base.addColorStop(1, "#3a5c2b");
  g.fillStyle = base;
  g.fillRect(0, 0, c.width, c.height);

  // Mottled grass patches
  for (let i = 0; i < 260; i++) {
    const x = rnd() * c.width, y = rnd() * c.height;
    const r = 30 + rnd() * 110;
    const shade = rnd();
    const col = shade < 0.4 ? "63,102,45" : shade < 0.75 ? "84,124,58" : "52,84,40";
    const grad = g.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, `rgba(${col},${0.18 + rnd() * 0.16})`);
    grad.addColorStop(1, `rgba(${col},0)`);
    g.fillStyle = grad;
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }

  // Dirt clearings
  for (let i = 0; i < 7; i++) {
    const x = rnd() * c.width, y = rnd() * c.height, r = 40 + rnd() * 70;
    const grad = g.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, "rgba(96,72,44,0.55)");
    grad.addColorStop(0.7, "rgba(96,72,44,0.25)");
    grad.addColorStop(1, "rgba(96,72,44,0)");
    g.fillStyle = grad;
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

function makeDetailTexture() {
  const c = document.createElement("canvas");
  c.width = 1024; c.height = 768;
  const g = c.getContext("2d");
  const rnd = mulberry32(4242);

  // Rocks
  for (let i = 0; i < 40; i++) {
    const x = rnd() * c.width, y = rnd() * c.height, r = 3 + rnd() * 6;
    g.fillStyle = "rgba(0,0,0,0.22)";
    g.beginPath(); g.ellipse(x + 1.5, y + 2, r, r * 0.6, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#8a8f86";
    g.beginPath(); g.ellipse(x, y, r, r * 0.7, rnd(), 0, Math.PI * 2); g.fill();
    g.fillStyle = "rgba(255,255,255,0.25)";
    g.beginPath(); g.ellipse(x - r * 0.3, y - r * 0.3, r * 0.4, r * 0.25, 0, 0, Math.PI * 2); g.fill();
  }

  // Grass tufts
  for (let i = 0; i < 1400; i++) {
    const x = rnd() * c.width, y = rnd() * c.height;
    const h = 4 + rnd() * 7;
    const lean = (rnd() - 0.5) * 4;
    g.strokeStyle = rnd() < 0.5 ? "rgba(120,170,80,0.5)" : "rgba(70,110,50,0.55)";
    g.lineWidth = 1;
    g.beginPath();
    g.moveTo(x, y);
    g.quadraticCurveTo(x + lean * 0.5, y - h * 0.6, x + lean, y - h);
    g.stroke();
  }

  // Wildflowers
  for (let i = 0; i < 120; i++) {
    const x = rnd() * c.width, y = rnd() * c.height;
    const col = ["#e8d15a", "#e88fb0", "#dfe6ea", "#c98fe8"][(rnd() * 4) | 0];
    g.fillStyle = col;
    g.beginPath(); g.arc(x, y, 1.6, 0, Math.PI * 2); g.fill();
  }

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

// --------------------------------------------------------------- tree meshes
const treeGroup = new THREE.Group();
scene.add(treeGroup);
const treeMeshes = new Map(); // id -> THREE.Group

const trunkGeo = new THREE.CylinderGeometry(0.62, 0.95, 1, 7);
const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6b4526, roughness: 0.95, flatShading: true });
const pineGeo = new THREE.ConeGeometry(1, 1, 8);
const blobGeo = new THREE.IcosahedronGeometry(1, 0);

function makeTree(id, kind) {
  const rnd = mulberry32(hashStr(id));
  const group = new THREE.Group();

  if (kind === "berry") {
    // Low bush with red berries.
    const bushMat = new THREE.MeshStandardMaterial({ color: 0x2f5a26, roughness: 1, flatShading: true });
    for (let i = 0; i < 4; i++) {
      const blob = new THREE.Mesh(blobGeo, bushMat);
      const r = 2.6 + rnd() * 1.6;
      blob.scale.setScalar(r);
      blob.position.set((rnd() - 0.5) * 4, 2.4 + rnd() * 1.6, (rnd() - 0.5) * 4);
      blob.castShadow = true;
      group.add(blob);
    }
    const berryMat = new THREE.MeshStandardMaterial({ color: 0xc23b3b, roughness: 0.6, emissive: 0x3a0b0b });
    for (let i = 0; i < 9; i++) {
      const berry = new THREE.Mesh(new THREE.SphereGeometry(0.42, 8, 6), berryMat);
      berry.position.set((rnd() - 0.5) * 5, 2.6 + rnd() * 3, (rnd() - 0.5) * 5);
      group.add(berry);
    }
    group.userData.swayAmp = 0.015;
    return group;
  }

  if (kind === "fiber") {
    // Tall dry grass clump.
    const stalkMat = new THREE.MeshStandardMaterial({ color: 0x9aa84e, roughness: 1 });
    for (let i = 0; i < 7; i++) {
      const h = 3 + rnd() * 3;
      const stalk = new THREE.Mesh(new THREE.ConeGeometry(0.28, h, 4), stalkMat);
      stalk.position.set((rnd() - 0.5) * 4, h / 2, (rnd() - 0.5) * 4);
      stalk.rotation.z = (rnd() - 0.5) * 0.4;
      stalk.castShadow = true;
      group.add(stalk);
    }
    group.userData.swayAmp = 0.05;
    return group;
  }

  const pine = kind === "pine";
  const trunkH = pine ? 9 + rnd() * 4 : 7 + rnd() * 4;
  const trunkR = 0.9 + rnd() * 0.5;

  const trunk = new THREE.Mesh(trunkGeo, trunkMat);
  trunk.scale.set(trunkR, trunkH, trunkR);
  trunk.position.y = trunkH / 2;
  trunk.castShadow = true;
  trunk.receiveShadow = true;
  group.add(trunk);

  if (pine) {
    const tiers = 3;
    for (let i = 0; i < tiers; i++) {
      const r = (7.5 - i * 1.8) * (0.85 + rnd() * 0.25);
      const h = 8 + rnd() * 2.5;
      const mat = new THREE.MeshStandardMaterial({
        color: new THREE.Color().setHSL(0.30 + rnd() * 0.03, 0.45 + rnd() * 0.12, 0.20 + rnd() * 0.07),
        roughness: 1,
        flatShading: true,
      });
      const cone = new THREE.Mesh(pineGeo, mat);
      cone.scale.set(r, h, r);
      cone.position.y = trunkH * 0.7 + i * (h * 0.55);
      cone.castShadow = true;
      group.add(cone);
    }
  } else {
    const n = 5;
    const canopyBase = trunkH + 4;
    for (let i = 0; i < n; i++) {
      const r = 4 + rnd() * 3;
      const mat = new THREE.MeshStandardMaterial({
        color: new THREE.Color().setHSL(0.24 + rnd() * 0.05, 0.42 + rnd() * 0.16, 0.26 + rnd() * 0.1),
        roughness: 1,
        flatShading: true,
      });
      const blob = new THREE.Mesh(blobGeo, mat);
      blob.scale.setScalar(r);
      blob.position.set(
        (rnd() - 0.5) * 8,
        canopyBase + (rnd() - 0.5) * 5,
        (rnd() - 0.5) * 8
      );
      blob.castShadow = true;
      group.add(blob);
    }
  }

  group.rotation.y = rnd() * Math.PI * 2;
  group.userData.swayAmp = 0.02;
  return group;
}

function syncTrees(state, time) {
  const seen = new Set();
  state.trees.forEach((tree, id) => {
    seen.add(id);
    let mesh = treeMeshes.get(id);
    if (!mesh) {
      mesh = makeTree(id, tree.kind);
      mesh.position.set(tree.x, 0, tree.y);
      mesh.userData.treeId = id;
      treeMeshes.set(id, mesh);
      treeGroup.add(mesh);
    }
    // Gentle sway, mirroring the original animation.
    mesh.rotation.z = Math.sin(time * 0.9 + tree.x * 0.05) * (mesh.userData.swayAmp || 0.02);
  });
  for (const [id, mesh] of treeMeshes) {
    if (!seen.has(id)) {
      treeGroup.remove(mesh);
      disposeGroup(mesh);
      treeMeshes.delete(id);
    }
  }
}

// ------------------------------------------------------------------- rocks
const rockGroup = new THREE.Group();
scene.add(rockGroup);
const rockMeshes = new Map();
const rockGeo = new THREE.DodecahedronGeometry(1, 0);
const rockMat = new THREE.MeshStandardMaterial({ color: 0x8a8f86, roughness: 0.95, flatShading: true });

function makeRock(id) {
  const rnd = mulberry32(hashStr(id) ^ 0x9e3779b9);
  const group = new THREE.Group();
  const n = 2 + Math.floor(rnd() * 3);
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(rockGeo, rockMat);
    const s = 3 + rnd() * 3;
    m.scale.set(s, s * (0.7 + rnd() * 0.4), s);
    m.position.set((rnd() - 0.5) * 6, s * 0.5, (rnd() - 0.5) * 6);
    m.rotation.set(rnd(), rnd(), rnd());
    m.castShadow = true;
    m.receiveShadow = true;
    group.add(m);
  }
  return group;
}

function syncRocks(state) {
  const seen = new Set();
  state.rocks.forEach((rock, id) => {
    seen.add(id);
    let mesh = rockMeshes.get(id);
    if (!mesh) {
      mesh = makeRock(id);
      mesh.position.set(rock.x, 0, rock.y);
      mesh.userData.rockId = id;
      rockMeshes.set(id, mesh);
      rockGroup.add(mesh);
    }
  });
  for (const [id, mesh] of rockMeshes) {
    if (!seen.has(id)) {
      rockGroup.remove(mesh);
      disposeGroup(mesh);
      rockMeshes.delete(id);
    }
  }
}

// ---------------------------------------------------------------- campfires
const fireGroup = new THREE.Group();
scene.add(fireGroup);
const fireMeshes = new Map();
const emberMat = new THREE.MeshStandardMaterial({ color: 0xff7a2a, emissive: 0xff5a10, emissiveIntensity: 1.6, roughness: 1 });
const stoneMat = new THREE.MeshStandardMaterial({ color: 0x6f7370, roughness: 1, flatShading: true });
const fireLight = new THREE.PointLight(0xff9a4a, 0, 260, 2);
scene.add(fireLight);

function makeFire(id) {
  const rnd = mulberry32(hashStr(id) ^ 0x85ebca6b);
  const group = new THREE.Group();
  // Ring of stones
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2;
    const s = new THREE.Mesh(rockGeo, stoneMat);
    s.scale.setScalar(0.8 + rnd() * 0.4);
    s.position.set(Math.cos(a) * 4.2, 0.5, Math.sin(a) * 4.2);
    s.castShadow = true;
    group.add(s);
  }
  // Logs
  const logMat = new THREE.MeshStandardMaterial({ color: 0x4a3018, roughness: 1, flatShading: true });
  for (let i = 0; i < 3; i++) {
    const log = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 6, 5), logMat);
    log.rotation.z = Math.PI / 2;
    log.rotation.y = (i / 3) * Math.PI;
    log.position.y = 1.2;
    group.add(log);
  }
  // Flame
  const flame = new THREE.Mesh(new THREE.ConeGeometry(2.2, 6, 6), emberMat);
  flame.position.y = 3.6;
  group.add(flame);
  group.userData.flame = flame;
  return group;
}

function syncFires(state) {
  const seen = new Set();
  state.fires.forEach((fire, id) => {
    seen.add(id);
    let mesh = fireMeshes.get(id);
    if (!mesh) {
      mesh = makeFire(id);
      mesh.position.set(fire.x, 0, fire.y);
      mesh.userData.fireId = id;
      fireMeshes.set(id, mesh);
      fireGroup.add(mesh);
    }
    const frac = clamp(fire.fuel / 90, 0, 1.2);
    const flick = 0.85 + Math.random() * 0.3;
    mesh.userData.flame.scale.set(frac * flick, frac * (0.9 + Math.random() * 0.4), frac * flick);
  });
  for (const [id, mesh] of fireMeshes) {
    if (!seen.has(id)) {
      fireGroup.remove(mesh);
      disposeGroup(mesh);
      fireMeshes.delete(id);
    }
  }
}

// ------------------------------------------------------------------- ponds
const waterGroup = new THREE.Group();
scene.add(waterGroup);
const waterMeshes = new Map();
const waterMat = new THREE.MeshStandardMaterial({
  color: 0x2f6f9e, roughness: 0.25, metalness: 0.1,
  transparent: true, opacity: 0.85,
});

function makeWater(id) {
  const rnd = mulberry32(hashStr(id) ^ 0xc2b2ae35);
  const group = new THREE.Group();
  const r = 26 + rnd() * 10;
  const disc = new THREE.Mesh(new THREE.CircleGeometry(r, 24), waterMat);
  disc.rotation.x = -Math.PI / 2;
  disc.position.y = 0.06;
  disc.receiveShadow = true;
  group.add(disc);
  // Damp bank ring so the pond edge reads against the grass.
  const bank = new THREE.Mesh(new THREE.RingGeometry(r * 0.92, r * 1.16, 24),
    new THREE.MeshStandardMaterial({ color: 0x5a4a2e, roughness: 1 }));
  bank.rotation.x = -Math.PI / 2;
  bank.position.y = 0.04;
  group.add(bank);
  group.userData.waterRadius = r;
  return group;
}

function syncWater(state) {
  const seen = new Set();
  state.waters.forEach((w, id) => {
    seen.add(id);
    let mesh = waterMeshes.get(id);
    if (!mesh) {
      mesh = makeWater(id);
      mesh.position.set(w.x, 0, w.y);
      mesh.userData.waterId = id;
      waterMeshes.set(id, mesh);
      waterGroup.add(mesh);
    }
  });
  for (const [id, mesh] of waterMeshes) {
    if (!seen.has(id)) {
      waterGroup.remove(mesh);
      disposeGroup(mesh);
      waterMeshes.delete(id);
    }
  }
}

function disposeGroup(group) {
  group.traverse((o) => {
    if (o.isMesh) {
      if (!sharedAssets().has(o.geometry)) o.geometry.dispose();
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      for (const m of mats) if (m && !sharedAssets().has(m)) m.dispose();
    }
  });
}

// Assets reused across many meshes must survive any single group's disposal.
let _sharedAssets = null;
function sharedAssets() {
  if (!_sharedAssets) {
    _sharedAssets = new Set([
      trunkGeo, pineGeo, blobGeo, rockGeo, particleGeo,
      trunkMat, rockMat, emberMat, stoneMat, waterMat,
    ]);
  }
  return _sharedAssets;
}

// -------------------------------------------------------------- player meshes
const playerGroup = new THREE.Group();
scene.add(playerGroup);
const players = new Map(); // id -> { group, torso, legL, legR, armL, armR, woodLabel, phase, facing, px, py, moving }

const ME_COLORS = { shirt: 0x4a90d9, shirtDark: 0x2f6699, hair: 0x3a2a1a };
const OTHER_COLORS = { shirt: 0xd9704a, shirtDark: 0xa04d2e, hair: 0x241a12 };

const legGeo = new THREE.CylinderGeometry(1, 1, 1, 6);
const armGeo = new THREE.CylinderGeometry(1, 1, 1, 6);
const torsoGeo = new THREE.CylinderGeometry(5.2, 4.4, 10, 10);
const headGeo = new THREE.SphereGeometry(3.6, 14, 12);
const noseGeo = new THREE.ConeGeometry(0.9, 2.2, 8);
const hairGeo = new THREE.SphereGeometry(3.9, 14, 10, 0, Math.PI * 2, 0, Math.PI * 0.62);

function makeWoodLabel() {
  const c = document.createElement("canvas");
  c.width = 256; c.height = 64;
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  sprite.scale.set(20, 5, 1);
  sprite.position.y = 25;
  sprite.renderOrder = 999;
  return { sprite, canvas: c, tex, value: null };
}

function paintWoodLabel(label, value) {
  if (label.value === value) return;
  label.value = value;
  const g = label.canvas.getContext("2d");
  g.clearRect(0, 0, 256, 64);
  g.fillStyle = "rgba(0,0,0,0.55)";
  g.beginPath();
  if (g.roundRect) g.roundRect(28, 8, 200, 48, 16);
  else g.rect(28, 8, 200, 48);
  g.fill();
  g.fillStyle = "#fff";
  g.font = "bold 34px ui-sans-serif, system-ui, sans-serif";
  g.textAlign = "center";
  g.textBaseline = "middle";
  g.fillText(`\u{1FAB5} ${value}`, 128, 33);
  label.tex.needsUpdate = true;
}

function makePlayer(isMe) {
  const c = isMe ? ME_COLORS : OTHER_COLORS;
  const group = new THREE.Group();
  const skinMat = new THREE.MeshStandardMaterial({ color: 0xe8b98a, roughness: 0.85 });
  const legMat = new THREE.MeshStandardMaterial({ color: 0x33414f, roughness: 0.9 });
  const torsoMat = new THREE.MeshStandardMaterial({ color: c.shirt, roughness: 0.8 });
  const armMat = new THREE.MeshStandardMaterial({ color: c.shirtDark, roughness: 0.85 });
  const hairMat = new THREE.MeshStandardMaterial({ color: c.hair, roughness: 1 });

  const torso = new THREE.Mesh(torsoGeo, torsoMat);
  torso.position.y = 12.5;
  torso.castShadow = true;
  group.add(torso);

  const head = new THREE.Mesh(headGeo, skinMat);
  head.position.y = 20;
  head.castShadow = true;
  group.add(head);

  const hair = new THREE.Mesh(hairGeo, hairMat);
  hair.position.set(0, 20.6, -0.4);
  hair.rotation.x = -Math.PI / 2;
  group.add(hair);

  const nose = new THREE.Mesh(noseGeo, skinMat);
  nose.rotation.x = Math.PI / 2;
  nose.position.set(0, 19.8, 3.4);
  group.add(nose);

  function limb(x, y, z, w, len, mat) {
    const pivot = new THREE.Group();
    pivot.position.set(x, y, z);
    const m = new THREE.Mesh(armGeo, mat);
    m.scale.set(w, len, w);
    m.position.y = -len / 2;
    m.castShadow = true;
    pivot.add(m);
    group.add(pivot);
    return pivot;
  }
  const legL = limb(-2.4, 8, 0, 1.7, 8, legMat);
  const legR = limb(2.4, 8, 0, 1.7, 8, legMat);
  const armL = limb(-5.6, 17, 0, 1.5, 7.5, armMat);
  const armR = limb(5.6, 17, 0, 1.5, 7.5, armMat);

  // A held tool, shown only when one is equipped. Attached to the right arm
  // so it swings with the arm during chopping/mining.
  const toolGroup = new THREE.Group();
  const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 7, 5), new THREE.MeshStandardMaterial({ color: 0x6b4526, roughness: 1 }));
  handle.position.y = -7;
  toolGroup.add(handle);
  const axeHead = new THREE.Mesh(new THREE.BoxGeometry(2.4, 1.6, 0.5), new THREE.MeshStandardMaterial({ color: 0xb8bcc2, roughness: 0.5, metalness: 0.4 }));
  axeHead.position.set(1.2, -9.5, 0);
  toolGroup.add(axeHead);
  const pickHead = new THREE.Mesh(new THREE.ConeGeometry(0.7, 4, 4), new THREE.MeshStandardMaterial({ color: 0xb8bcc2, roughness: 0.5, metalness: 0.4 }));
  pickHead.rotation.z = Math.PI / 2;
  pickHead.position.set(0, -10, 0);
  toolGroup.add(pickHead);
  toolGroup.visible = false;
  armR.add(toolGroup);

  const woodLabel = makeWoodLabel();
  group.add(woodLabel.sprite);

  return { group, torso, legL, legR, armL, armR, toolGroup, axeHead, pickHead, woodLabel, phase: 0, facing: 0, px: null, py: null, moving: false, isMe, swing: 0, tool: "none" };
}

// ------------------------------------------------------------ fx particles
const particles = [];
const particleGeo = new THREE.BoxGeometry(1, 1, 1);
const floaterGroup = new THREE.Group();
scene.add(floaterGroup);

function spawnHarvestFx(x, y) {
  for (let i = 0; i < 18; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 30 + Math.random() * 90;
    const leaf = Math.random() < 0.6;
    const color = leaf
      ? new THREE.Color().setHSL(0.25 + Math.random() * 0.11, 0.6, 0.3 + Math.random() * 0.2)
      : new THREE.Color(0x7a5230);
    const mat = new THREE.MeshBasicMaterial({ color });
    const mesh = new THREE.Mesh(particleGeo, mat);
    const size = 2 + Math.random() * 3;
    mesh.scale.setScalar(size);
    mesh.position.set(x, 12, y);
    scene.add(mesh);
    particles.push({
      mesh, mat,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40, vz: 30 + Math.random() * 80,
      life: 0.7 + Math.random() * 0.6, max: 1.3,
      rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 8,
    });
  }

  const c = document.createElement("canvas");
  c.width = 256; c.height = 96;
  const g = c.getContext("2d");
  g.font = "bold 44px ui-sans-serif, system-ui, sans-serif";
  g.textAlign = "center";
  g.textBaseline = "middle";
  g.lineWidth = 8;
  g.strokeStyle = "rgba(0,0,0,0.6)";
  g.fillStyle = "#ffe08a";
  g.strokeText("+1 \u{1FAB5}", 128, 48);
  g.fillText("+1 \u{1FAB5}", 128, 48);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(26, 9.75, 1);
  sprite.position.set(x, 30, y);
  sprite.renderOrder = 998;
  floaterGroup.add(sprite);
  floaters.push({ sprite, mat, tex, life: 1.1, max: 1.1 });
}

const floaters = [];
function updateFx(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) {
      scene.remove(p.mesh);
      p.mat.dispose();
      particles.splice(i, 1);
      continue;
    }
    p.vz += 220 * dt;
    p.mesh.position.x += p.vx * dt;
    p.mesh.position.y += p.vy * dt;
    p.mesh.position.z += p.vz * dt;
    p.mesh.position.y = Math.max(0.5, p.mesh.position.y);
    p.vx *= 0.98;
    p.mesh.rotation.x = p.rot += p.vr * dt;
    p.mat.opacity = clamp(p.life / p.max, 0, 1);
    p.mat.transparent = true;
  }
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.life -= dt;
    if (f.life <= 0) {
      floaterGroup.remove(f.sprite);
      f.mat.dispose();
      f.tex.dispose();
      floaters.splice(i, 1);
      continue;
    }
    f.sprite.position.y += 22 * dt;
    f.mat.opacity = clamp(f.life / f.max, 0, 1);
  }
}

// ------------------------------------------------------------------- input
const keys = {};
addEventListener("keydown", (e) => { keys[e.key.toLowerCase()] = true; });
addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });

let local = { x: 500, y: 350 };
let facing = 0;          // radians, 0 = facing +x in world space
let walkPhase = 0;
let room = null;
let myId = null;
let connected = false;
let lastAction = null;   // { type, id } of the last node swung at

const raycaster = new THREE.Raycaster();

// Raycast the pointer against every interactive node type and return the
// closest hit together with its server-side id and type.
function pickTarget(e) {
  const ndc = new THREE.Vector2(
    (e.clientX / window.innerWidth) * 2 - 1,
    -(e.clientY / window.innerHeight) * 2 + 1
  );
  raycaster.setFromCamera(ndc, camera);
  const groups = [
    ["tree", treeMeshes, "treeId"],
    ["rock", rockMeshes, "rockId"],
    ["fire", fireMeshes, "fireId"],
    ["water", waterMeshes, "waterId"],
  ];
  let best = null;
  for (const [type, meshes, key] of groups) {
    const hits = raycaster.intersectObjects([...meshes.values()], true);
    if (!hits.length) continue;
    let o = hits[0].object;
    while (o && !o.userData[key]) o = o.parent;
    if (!o || !o.userData[key]) continue;
    if (!best || hits[0].distance < best.dist) {
      best = { type, id: o.userData[key], dist: hits[0].distance };
    }
  }
  return best;
}

canvas.addEventListener("click", (e) => {
  if (!room || !room.state) return;
  const t = pickTarget(e);
  if (!t) return;
  room.send("interact", { targetType: t.type, targetId: t.id });
  const a = players.get(myId);
  if (a) a.swing = 1;
  if (t.type !== "fire") {
    lastAction = t;
  }
});

addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (k === "f") {
    if (lastAction && room) room.send("interact", { targetType: lastAction.type, targetId: lastAction.id });
  } else if (k === "e") {
    if (room) room.send("consume", { item: "food" });
  } else if (k === "q") {
    if (room) room.send("consume", { item: "water" });
  } else if (k === "r") {
    // Drink from the nearest pond within reach.
    if (room && room.state) {
      let best = null, bestD = Infinity;
      room.state.waters.forEach((w, id) => {
        const d = Math.hypot(w.x - local.x, w.y - local.y);
        if (d < bestD) { bestD = d; best = id; }
      });
      if (best && bestD <= 70) room.send("interact", { targetType: "water", targetId: best });
    }
  } else if (k === "1") {
    if (room) room.send("craft", { item: "axe" });
  } else if (k === "2") {
    if (room) room.send("craft", { item: "pickaxe" });
  } else if (k === "3") {
    if (room) room.send("craft", { item: "campfire" });
  } else if (k === "4") {
    // Stoke the nearest campfire within reach.
    if (room && room.state) {
      let best = null, bestD = Infinity;
      room.state.fires.forEach((fire, id) => {
        const d = Math.hypot(fire.x - local.x, fire.y - local.y);
        if (d < bestD) { bestD = d; best = id; }
      });
      if (best && bestD <= 70) room.send("interact", { targetType: "fire", targetId: best });
    }
  }
});

// ------------------------------------------------------------------ network
const proto = location.protocol === "https:" ? "wss" : "ws";
const endpoint = `${proto}://${location.host}`;
const client = new Colyseus.Client(endpoint);

async function connect() {
  try {
    room = await client.joinOrCreate("survival");
    myId = room.sessionId;
    connected = true;
    room.onStateChange.once((state) => {
      const me = state.players.get(myId);
      if (me) { local.x = me.x; local.y = me.y; }
    });
    room.onMessage("notice", (data) => showNotice(data && data.msg));
    room.onLeave(() => { connected = false; });
    setInterval(() => {
      if (room) room.send("move", { x: local.x, y: local.y, sprint: !!(keys["shift"] && (keys["w"] || keys["a"] || keys["s"] || keys["d"] || keys["arrowup"] || keys["arrowdown"] || keys["arrowleft"] || keys["arrowright"])) });
    }, 50);
  } catch (err) {
    console.error(err);
    statsEl.textContent = "Connection failed — see console";
  }
}

let noticeUntil = 0;
function showNotice(msg) {
  if (!msg) return;
  noticeEl.textContent = msg;
  noticeEl.style.opacity = "1";
  noticeUntil = performance.now() + 2200;
}

// --------------------------------------------------------------------- loop
const startTime = performance.now();
const clock = new THREE.Clock();

// A day/night tint blended over the whole scene each frame.
const skyTint = new THREE.Mesh(
  new THREE.PlaneGeometry(6000, 6000),
  new THREE.MeshBasicMaterial({ color: 0x0c1834, transparent: true, opacity: 0, depthWrite: false })
);
skyTint.rotation.x = -Math.PI / 2;
skyTint.position.y = 60;
skyTint.renderOrder = 500;
scene.add(skyTint);

const sunDay = new THREE.Color(0xfff2cf);
const sunDusk = new THREE.Color(0xffa860);
const sunNight = new THREE.Color(0x5a6ea8);

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());
  const now = performance.now();
  const time = (now - startTime) / 1000;

  // Day/night is authoritative on the server so every client agrees.
  const tOfDay = (room && room.state) ? room.state.timeOfDay : 0.35;

  // ---- movement ----
  const me = (room && room.state) ? room.state.players.get(myId) : null;
  const canMove = !me || me.alive;
  const sprintKey = !!keys["shift"];
  const sprinting = sprintKey && canMove && (!me || me.stamina > 1);
  const speed = 170 * (sprinting ? 1.65 : (me && me.stamina <= 1 ? 0.5 : 1));
  let dx = 0, dy = 0;
  if (canMove) {
    if (keys["w"] || keys["arrowup"]) dy -= 1;
    if (keys["s"] || keys["arrowdown"]) dy += 1;
    if (keys["a"] || keys["arrowleft"]) dx -= 1;
    if (keys["d"] || keys["arrowright"]) dx += 1;
  }
  const moving = dx !== 0 || dy !== 0;
  if (moving) {
    const len = Math.hypot(dx, dy);
    dx /= len; dy /= len;
    local.x = clamp(local.x + dx * speed * dt, 20, W - 20);
    local.y = clamp(local.y + dy * speed * dt, 20, H - 20);
    facing = Math.atan2(dy, dx);
    walkPhase += dt * (sprinting ? 15 : 11);
  }

  // ---- day / night lighting ----
  const s = Math.sin(tOfDay * Math.PI * 2 - Math.PI / 2); // -1 midnight, +1 noon
  const dayAmt = clamp((s + 0.15) / 0.9, 0, 1);
  const night = 1 - dayAmt;
  const warmth = 1 - Math.abs(s);

  sun.intensity = 0.25 + dayAmt * 2.6;
  sun.color.copy(sunNight).lerp(sunDay, dayAmt);
  if (warmth > 0.1) sun.color.lerp(sunDusk, warmth * 0.5);
  hemi.intensity = 0.25 + dayAmt * 0.85;

  scene.background.setRGB(
    0.04 + dayAmt * 0.24,
    0.10 + dayAmt * 0.34,
    0.06 + dayAmt * 0.22
  );
  scene.fog.color.copy(scene.background);

  // Tint overlay for night / dawn dusk
  skyTint.material.opacity = night * 0.5;
  skyTint.material.color.setRGB(0.05, 0.09, 0.20);

  // ---- camera follows player, looking straight down ----
  const camTarget = new THREE.Vector3(local.x, 0, local.y);
  const camPos = new THREE.Vector3(local.x, 760, local.y + 0.001);
  camera.position.lerp(camPos, 1 - Math.pow(0.001, dt));
  camera.lookAt(camTarget);

  // Sun + shadow frustum follow the player
  sun.position.set(local.x + 220, 480, local.y + 160);
  sun.target.position.set(local.x, 0, local.y);
  sun.target.updateMatrixWorld();
  skyTint.position.x = local.x;
  skyTint.position.z = local.y;

  // ---- world ----
  if (room && room.state) {
    syncTrees(room.state, time);
    syncRocks(room.state);
    syncFires(room.state);
    syncWater(room.state);

    // A single light follows the nearest campfire so night stays readable.
    let nearestFire = null, nearestD = Infinity;
    room.state.fires.forEach((fire) => {
      const d = Math.hypot(fire.x - local.x, fire.y - local.y);
      if (d < nearestD) { nearestD = d; nearestFire = fire; }
    });
    if (nearestFire && nearestD < 500) {
      fireLight.position.set(nearestFire.x, 22, nearestFire.y);
      fireLight.intensity = 2.6 * clamp(nearestFire.fuel / 60, 0, 1) * (0.85 + Math.random() * 0.3);
    } else {
      fireLight.intensity = 0;
    }

    const seen = new Set();
    room.state.players.forEach((p, id) => {
      seen.add(id);
      const isMe = id === myId;
      let a = players.get(id);
      if (!a) { a = makePlayer(isMe); playerGroup.add(a.group); players.set(id, a); }

      let px, py, f, phase, mv;
      if (isMe) {
        px = local.x; py = local.y; f = facing; phase = walkPhase; mv = moving;
      } else {
        if (a.px === null) { a.px = p.x; a.py = p.y; }
        const moved = Math.hypot(p.x - a.px, p.y - a.py) > 0.4;
        if (moved) { a.facing = Math.atan2(p.y - a.py, p.x - a.px); a.phase += dt * 11; }
        a.moving = moved; a.px = p.x; a.py = p.y;
        px = p.x; py = p.y; f = a.facing; phase = a.phase; mv = a.moving;
      }

      a.group.position.set(px, 0, py);
      // World +x is scene +x; world +y is scene +z. The model faces scene +z,
      // so rotate so it points along the movement direction.
      a.group.rotation.y = Math.PI / 2 - f;

      // Fade out the body while dead.
      a.group.visible = p.alive;
      a.woodLabel.sprite.visible = p.alive;

      // Held tool mesh.
      a.tool = p.tool;
      const hasTool = p.tool === "axe" || p.tool === "pickaxe";
      a.toolGroup.visible = hasTool;
      if (hasTool) {
        a.axeHead.visible = p.tool === "axe";
        a.pickHead.visible = p.tool === "pickaxe";
      }

      // Chop / mine swing: a short burst of arm motion triggered by actions.
      if (p.action) a.swing = 1;
      a.swing = Math.max(0, a.swing - dt * 3.2);
      const swingPose = Math.sin((1 - a.swing) * Math.PI) * 1.5 * a.swing;

      const walk = mv ? Math.sin(phase) * 0.7 : 0;
      a.legL.rotation.x = walk;
      a.legR.rotation.x = -walk;
      a.armL.rotation.x = -walk * 0.8;
      a.armR.rotation.x = walk * 0.8 - swingPose;

      paintWoodLabel(a.woodLabel, p.wood);
    });

    for (const [id, a] of players) {
      if (!seen.has(id)) {
        playerGroup.remove(a.group);
        disposeGroup(a.group);
        players.delete(id);
      }
    }
  } else {
    // Not connected yet: show the local survivor so the screen isn't empty.
    let a = players.get("__local__");
    if (!a) { a = makePlayer(true); playerGroup.add(a.group); players.set("__local__", a); }
    a.group.position.set(local.x, 0, local.y);
    a.group.rotation.y = Math.PI / 2 - facing;
    a.woodLabel.sprite.visible = false;
  }

  updateFx(dt);
  renderer.render(scene, camera);

  // ---- HUD ----
  if (noticeUntil && now > noticeUntil) {
    noticeEl.style.opacity = "0";
    noticeUntil = 0;
  }
  if (connected && room && room.state) {
    const me = room.state.players.get(myId);
    const hours = Math.floor(tOfDay * 24);
    const mins = Math.floor((tOfDay * 24 * 60) % 60);
    const phaseName = tOfDay < 0.25 ? "\u{1F305} Dawn" : tOfDay < 0.5 ? "\u2600\uFE0F Day" : tOfDay < 0.75 ? "\u{1F307} Dusk" : "\u{1F319} Night";
    statsEl.innerHTML =
      `<div class="big">Day ${room.state.day} · ${phaseName} ${String(hours).padStart(2, "0")}:${String(mins).padStart(2, "0")}</div>` +
      `<div class="row"><span class="muted">Survivors</span><span><b>${room.state.players.size}</b></span></div>` +
      `<div class="row"><span class="muted">Nodes left</span><span><b>${room.state.trees.size + room.state.rocks.size}</b></span></div>` +
      (me ? `<div class="row"><span class="muted">Deaths</span><span><b>${me.deaths}</b></span></div>` : "");

    if (me) {
      const vit = [
        ["\u2764\uFE0F Health", me.hp, "#e0574b"],
        ["\u{1F356} Food", me.hunger, "#d9a441"],
        ["\u{1F4A7} Water", me.thirst, "#4aa3d9"],
        ["\u{1F525} Warmth", me.warmth, "#e07a3a"],
        ["\u26A1 Stamina", me.stamina, "#8fd14a"],
      ];
      vitalsEl.innerHTML = vit.map(([label, v, col]) =>
        `<div class="vital"><div class="row"><span class="muted">${label}</span><span>${Math.round(v)}</span></div>` +
        `<div class="bar"><i style="width:${clamp(v, 0, 100)}%;background:${col}"></i></div></div>`
      ).join("");

      const tool = me.tool === "none" ? "bare hands" : `${me.tool} (${me.toolDurability})`;
      invEl.innerHTML =
        `<div class="row"><span class="muted">\u{1FAB5} Wood</span><span><b>${me.wood}</b></span></div>` +
        `<div class="row"><span class="muted">\u{1FAA8} Stone</span><span><b>${me.stone}</b></span></div>` +
        `<div class="row"><span class="muted">\u{1F33F} Fiber</span><span><b>${me.fiber}</b></span></div>` +
        `<div class="row"><span class="muted">\u{1F356} Food</span><span><b>${me.food}</b></span></div>` +
        `<div class="row"><span class="muted">\u{1F4A7} Water</span><span><b>${me.water}</b></span></div>` +
        `<div class="row"><span class="muted">Tool</span><span><b>${tool}</b></span></div>` +
        `<div class="muted" style="margin-top:6px">1 axe · 2 pickaxe · 3 campfire · 4 stoke</div>`;

      const dead = !me.alive;
      deathEl.classList.toggle("show", dead);
      if (dead) {
        const cause = me.thirst <= 0 ? "You died of thirst."
          : me.hunger <= 0 ? "You starved."
          : me.warmth < 20 ? "You froze in the cold."
          : "Your body gave out.";
        deathCauseEl.textContent = `${cause} You lost everything you were carrying.`;
      }
    }
  }
}

resize();
animate();
connect();
</script>
