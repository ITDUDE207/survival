<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Survival</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; }
  body {

    background: #0d130d;

  #game { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; top: 14px; left: 14px; z-index: 10; display: grid; gap: 8px; }

</style>

<body>
<div id="hud">
  <div class="panel" id="stats">Connecting…</div>
  <div class="panel muted">
    <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move &nbsp;·&nbsp; click a tree to chop</div>
  </div>
</div>
<canvas id="game"></canvas>

<script src="https://unpkg.com/colyseus.js@0.15.17/dist/colyseus.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from "three";

"use strict";

// The simulation keeps the original 2D top-down coordinates (x, y) over a
// W x H world. We map that plane onto the scene XZ plane (scene.x = world x,
// scene.z = world y) and view it from an elevated, tilted camera so the scene
// reads as real 3D rather than a flat top-down slice.
const W = 1000;
const H = 700;
const WORLD_CX = W / 2;
const WORLD_CZ = H / 2;

// Camera rig: a top-down 3D view pitched in from the south, similar to a
// classic action-RPG. Height + distance give a ~43° pitch so we clearly see
// the vertical faces and depth of objects, not just their tops.
const CAM_HEIGHT = 520;
const CAM_DIST = 560;

const canvas = document.getElementById("game");
const statsEl = document.getElementById("stats");

// ---------------------------------------------------------------- utilities
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

// ------------------------------------------------------------- three.js setup
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87b6d8);
scene.fog = new THREE.Fog(0x87b6d8, 1400, 2600);

const camera = new THREE.PerspectiveCamera(46, 1, 1, 6000);

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);

// Sun follows the player so its shadow frustum always covers what we can see.
const sun = new THREE.DirectionalLight(0xfff2cf, 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 1400;
sun.shadow.camera.left = -320;
sun.shadow.camera.right = 320;
sun.shadow.camera.top = 320;
sun.shadow.camera.bottom = -320;
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.8;
scene.add(sun);
scene.add(sun.target);

const hemi = new THREE.HemisphereLight(0xbcd8ff, 0x3a4a28, 0.85);
scene.add(hemi);

// ------------------------------------------------------------------- ground
// A large solid base so the play area never shows an edge from the tilted
// camera, with the detailed grass texture layered on top at the right scale.
const baseGround = new THREE.Mesh(
  new THREE.PlaneGeometry(6000, 6000),
  new THREE.MeshStandardMaterial({ color: 0x466f30, roughness: 1 })
);
baseGround.rotation.x = -Math.PI / 2;
baseGround.position.set(WORLD_CX, -0.05, WORLD_CZ);
baseGround.receiveShadow = true;
scene.add(baseGround);

const groundMat = new THREE.MeshStandardMaterial({ map: makeGroundTexture(), roughness: 1, metalness: 0 });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(W + 400, H + 400), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.set(WORLD_CX, 0, WORLD_CZ);
ground.receiveShadow = true;
scene.add(ground);

// Baked ground detail (rocks / grass / flowers) as an alpha-tested layer.
const detailMat = new THREE.MeshBasicMaterial({
  map: makeDetailTexture(),
  transparent: true,
  alphaTest: 0.35,
  depthWrite: false,
});
const detail = new THREE.Mesh(new THREE.PlaneGeometry(W + 120, H + 120), detailMat);
detail.rotation.x = -Math.PI / 2;
detail.position.set(WORLD_CX, 0.02, WORLD_CZ);
detail.renderOrder = 1;
scene.add(detail);

function makeGroundTexture() {
  const c = document.createElement("canvas");
  c.width = 1024; c.height = 768;
  const g = c.getContext("2d");
  const rnd = mulberry32(1337);

  const base = g.createLinearGradient(0, 0, 0, c.height);
  base.addColorStop(0, "#5a8a41");
  base.addColorStop(0.5, "#4d7a36");
  base.addColorStop(1, "#3f662c");
  g.fillStyle = base;
  g.fillRect(0, 0, c.width, c.height);

  for (let i = 0; i < 260; i++) {
    const x = rnd() * c.width, y = rnd() * c.height;
    const r = 30 + rnd() * 110;
    const shade = rnd();
    const col = shade < 0.4 ? "63,102,45" : shade < 0.75 ? "96,140,64" : "52,84,40";
    const grad = g.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, `rgba(${col},${0.18 + rnd() * 0.16})`);
    grad.addColorStop(1, `rgba(${col},0)`);
    g.fillStyle = grad;
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }

  for (let i = 0; i < 7; i++) {
    const x = rnd() * c.width, y = rnd() * c.height, r = 40 + rnd() * 70;
    const grad = g.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, "rgba(112,84,52,0.6)");
    grad.addColorStop(0.7, "rgba(112,84,52,0.28)");
    grad.addColorStop(1, "rgba(112,84,52,0)");
    g.fillStyle = grad;
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

function makeDetailTexture() {
  const c = document.createElement("canvas");
  c.width = 1024; c.height = 768;
  const g = c.getContext("2d");
  const rnd = mulberry32(4242);

  for (let i = 0; i < 46; i++) {
    const x = rnd() * c.width, y = rnd() * c.height, r = 4 + rnd() * 7;
    g.fillStyle = "rgba(0,0,0,0.22)";
    g.beginPath(); g.ellipse(x + 1.5, y + 2, r, r * 0.6, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#9aa096";
    g.beginPath(); g.ellipse(x, y, r, r * 0.7, rnd(), 0, Math.PI * 2); g.fill();
    g.fillStyle = "rgba(255,255,255,0.3)";
    g.beginPath(); g.ellipse(x - r * 0.3, y - r * 0.3, r * 0.4, r * 0.25, 0, 0, Math.PI * 2); g.fill();
  }

  for (let i = 0; i < 1600; i++) {
    const x = rnd() * c.width, y = rnd() * c.height;
    const h = 5 + rnd() * 8;
    const lean = (rnd() - 0.5) * 4;
    g.strokeStyle = rnd() < 0.5 ? "rgba(130,180,86,0.55)" : "rgba(74,116,52,0.6)";
    g.lineWidth = 1.2;
    g.beginPath();
    g.moveTo(x, y);
    g.quadraticCurveTo(x + lean * 0.5, y - h * 0.6, x + lean, y - h);
    g.stroke();
  }

  for (let i = 0; i < 130; i++) {
    const x = rnd() * c.width, y = rnd() * c.height;
    const col = ["#e8d15a", "#e88fb0", "#dfe6ea", "#c98fe8"][(rnd() * 4) | 0];
    g.fillStyle = col;
    g.beginPath(); g.arc(x, y, 1.7, 0, Math.PI * 2); g.fill();
  }

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

// --------------------------------------------------------------- tree meshes
const treeGroup = new THREE.Group();
scene.add(treeGroup);
const treeMeshes = new Map(); // id -> THREE.Group

const barkMat = new THREE.MeshStandardMaterial({ color: 0x6b4526, roughness: 0.95 });
const barkMatDark = new THREE.MeshStandardMaterial({ color: 0x50331b, roughness: 1 });

const TRUNK_SEGMENTS = 8;
function makeTrunkGeometry(rBottom, rTop, height) {
  const geo = new THREE.CylinderGeometry(rTop, rBottom, height, TRUNK_SEGMENTS, 3);
  const pos = geo.attributes.position;
  // Nudge ring vertices outward per-angle so the trunk looks organic rather
  // than like a smooth cylinder.
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i);
    const x = pos.getX(i), z = pos.getZ(i);
    const ang = Math.atan2(z, x);
    const wobble = 1 + Math.sin(ang * 3 + y * 0.4) * 0.08;
    pos.setX(i, x * wobble);
    pos.setZ(i, z * wobble);
  }
  geo.computeVertexNormals();
  return geo;
}

function makePineCanopy(rnd) {
  const group = new THREE.Group();
  const tiers = 4;
  let y = 0;
  for (let i = 0; i < tiers; i++) {
    const t = i / (tiers - 1);
    const r = (8.5 - t * 5.5) * (0.9 + rnd() * 0.2);
    const h = 9 - t * 3;
    const geo = new THREE.ConeGeometry(r, h, 9, 1);
    const mat = new THREE.MeshStandardMaterial({
      color: new THREE.Color().setHSL(0.31 + rnd() * 0.03, 0.5, 0.17 + t * 0.06),
      roughness: 1,
      flatShading: true,
    });
    const cone = new THREE.Mesh(geo, mat);
    cone.position.y = y + h * 0.4;
    cone.castShadow = true;
    cone.receiveShadow = true;
    group.add(cone);
    y += h * 0.52;
  }
  return group;
}

const blobGeo = new THREE.IcosahedronGeometry(1, 1);
function makeBroadleafCanopy(rnd) {
  const group = new THREE.Group();
  const clusters = 7;
  for (let i = 0; i < clusters; i++) {
    const r = 4 + rnd() * 3.2;
    const mat = new THREE.MeshStandardMaterial({
      color: new THREE.Color().setHSL(0.24 + rnd() * 0.06, 0.48 + rnd() * 0.16, 0.26 + rnd() * 0.12),
      roughness: 1,
      flatShading: true,
    });
    const blob = new THREE.Mesh(blobGeo, mat);
    blob.scale.set(r * (0.9 + rnd() * 0.4), r * (0.7 + rnd() * 0.4), r * (0.9 + rnd() * 0.4));
    const a = rnd() * Math.PI * 2;
    const rad = rnd() * 6.5;
    blob.position.set(Math.cos(a) * rad, 2 + rnd() * 8, Math.sin(a) * rad);
    blob.rotation.set(rnd() * Math.PI, rnd() * Math.PI, rnd() * Math.PI);
    blob.castShadow = true;
    blob.receiveShadow = true;
    group.add(blob);
  }
  return group;
}

function makeTree(id) {
  const rnd = mulberry32(hashStr(id));
  const pine = rnd() < 0.45;
  const group = new THREE.Group();

  const height = pine ? 26 + rnd() * 8 : 18 + rnd() * 6;
  const rBottom = 1.1 + rnd() * 0.5;
  const rTop = rBottom * 0.55;

  const trunk = new THREE.Mesh(makeTrunkGeometry(rBottom, rTop, height), barkMat);
  trunk.position.y = height / 2;
  trunk.castShadow = true;
  trunk.receiveShadow = true;
  group.add(trunk);

  // A couple of roots flaring at the base to seat the tree in the ground.
  const rootCount = 3 + ((rnd() * 3) | 0);
  for (let i = 0; i < rootCount; i++) {
    const a = (i / rootCount) * Math.PI * 2 + rnd();
    const root = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.9, 5, 5), barkMatDark);
    root.position.set(Math.cos(a) * rBottom * 0.9, 1.2, Math.sin(a) * rBottom * 0.9);
    root.rotation.set(Math.PI / 2.6, a, 0);
    root.castShadow = true;
    group.add(root);
  }

  const canopy = pine ? makePineCanopy(rnd) : makeBroadleafCanopy(rnd);
  canopy.position.y = pine ? height * 0.55 : height * 0.72;
  group.add(canopy);

  group.rotation.y = rnd() * Math.PI * 2;
  return group;
}

function syncTrees(state, time) {
  const seen = new Set();
  state.trees.forEach((tree, id) => {
    seen.add(id);
    let mesh = treeMeshes.get(id);
    if (!mesh) {
      mesh = makeTree(id);
      mesh.position.set(tree.x, 0, tree.y);
      mesh.userData.treeId = id;
      treeMeshes.set(id, mesh);
      treeGroup.add(mesh);
    }
    // Gentle sway, mirroring the original animation.
    mesh.rotation.z = Math.sin(time * 0.9 + tree.x * 0.05) * 0.02;
  });
  for (const [id, mesh] of treeMeshes) {
    if (!seen.has(id)) {
      treeGroup.remove(mesh);
      disposeGroup(mesh);
      treeMeshes.delete(id);
    }
  }
}

function disposeGroup(group) {
  group.traverse((o) => {
    if (o.isMesh) {
      o.geometry.dispose();
      if (Array.isArray(o.material)) o.material.forEach((m) => m.dispose());
      else if (o.material) o.material.dispose();
    }
  });
}

// -------------------------------------------------------------- player meshes
const playerGroup = new THREE.Group();
scene.add(playerGroup);
const players = new Map(); // id -> rig

const ME_COLORS = { shirt: 0x4a90d9, shirtDark: 0x2f6699, pants: 0x33414f, hair: 0x3a2a1a };
const OTHER_COLORS = { shirt: 0xd9704a, shirtDark: 0xa04d2e, pants: 0x3f4a55, hair: 0x241a12 };

const headGeo = new THREE.SphereGeometry(3.4, 18, 14);
const hairGeo = new THREE.SphereGeometry(3.7, 18, 14, 0, Math.PI * 2, 0, Math.PI * 0.6);
const noseGeo = new THREE.ConeGeometry(0.85, 2.1, 8);
const limbGeo = new THREE.CapsuleGeometry(1, 1, 4, 8);

function makeWoodLabel() {
  const c = document.createElement("canvas");
  c.width = 256; c.height = 64;
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  sprite.scale.set(20, 5, 1);
  sprite.renderOrder = 999;
  return { sprite, canvas: c, tex, value: null };
}

function paintWoodLabel(label, value) {
  if (label.value === value) return;
  label.value = value;
  const g = label.canvas.getContext("2d");
  g.clearRect(0, 0, 256, 64);
  g.fillStyle = "rgba(0,0,0,0.55)";
  g.beginPath();
  if (g.roundRect) g.roundRect(28, 8, 200, 48, 16);
  else g.rect(28, 8, 200, 48);
  g.fill();
  g.fillStyle = "#fff";
  g.font = "bold 34px ui-sans-serif, system-ui, sans-serif";
  g.textAlign = "center";
  g.textBaseline = "middle";
  g.fillText(`\u{1FAB5} ${value}`, 128, 33);
  label.tex.needsUpdate = true;
}

function makePlayer(isMe) {
  const c = isMe ? ME_COLORS : OTHER_COLORS;
  const group = new THREE.Group();
  const skinMat = new THREE.MeshStandardMaterial({ color: 0xe8b98a, roughness: 0.85 });
  const pantsMat = new THREE.MeshStandardMaterial({ color: c.pants, roughness: 0.9 });
  const torsoMat = new THREE.MeshStandardMaterial({ color: c.shirt, roughness: 0.8 });
  const armMat = new THREE.MeshStandardMaterial({ color: c.shirtDark, roughness: 0.85 });
  const hairMat = new THREE.MeshStandardMaterial({ color: c.hair, roughness: 1 });

  // Torso as a tapered capsule for a soft, rounded body.
  const torso = new THREE.Mesh(new THREE.CapsuleGeometry(4.4, 4, 6, 12), torsoMat);
  torso.position.y = 12.4;
  torso.castShadow = true;
  group.add(torso);

  const head = new THREE.Mesh(headGeo, skinMat);
  head.position.y = 19.6;
  head.castShadow = true;
  group.add(head);

  const hair = new THREE.Mesh(hairGeo, hairMat);
  hair.position.set(0, 20.2, -0.3);
  hair.rotation.x = -Math.PI / 2;
  group.add(hair);

  const nose = new THREE.Mesh(noseGeo, skinMat);
  nose.rotation.x = Math.PI / 2;
  nose.position.set(0, 19.4, 3.1);
  group.add(nose);

  function limb(x, y, z, r, len, mat) {
    const pivot = new THREE.Group();
    pivot.position.set(x, y, z);
    const m = new THREE.Mesh(limbGeo, mat);
    m.scale.set(r, len, r);
    m.position.y = -len / 2;
    m.castShadow = true;
    pivot.add(m);
    group.add(pivot);
    return pivot;
  }
  const legL = limb(-2.2, 7.5, 0, 1.6, 6.5, pantsMat);
  const legR = limb(2.2, 7.5, 0, 1.6, 6.5, pantsMat);
  const armL = limb(-4.8, 16.5, 0, 1.35, 6.5, armMat);
  const armR = limb(4.8, 16.5, 0, 1.35, 6.5, armMat);

  const woodLabel = makeWoodLabel();
  group.add(woodLabel.sprite);

  return { group, legL, legR, armL, armR, woodLabel, phase: 0, facing: 0, px: null, py: null, moving: false, isMe };
}

// ------------------------------------------------------------ fx particles
const particles = [];
const particleGeo = new THREE.BoxGeometry(1, 1, 1);
const floaters = [];
const floaterGroup = new THREE.Group();
scene.add(floaterGroup);

function spawnHarvestFx(x, y) {
  for (let i = 0; i < 20; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 30 + Math.random() * 90;
    const leaf = Math.random() < 0.6;
    const color = leaf
      ? new THREE.Color().setHSL(0.25 + Math.random() * 0.11, 0.6, 0.3 + Math.random() * 0.2)
      : new THREE.Color(0x7a5230);
    const mat = new THREE.MeshBasicMaterial({ color, transparent: true });
    const mesh = new THREE.Mesh(particleGeo, mat);
    mesh.scale.setScalar(2 + Math.random() * 3);
    mesh.position.set(x, 14, y);
    scene.add(mesh);
    particles.push({
      mesh, mat,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40, vz: 30 + Math.random() * 80,
      life: 0.7 + Math.random() * 0.6, max: 1.3,
      rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 8,
    });
  }

  const c = document.createElement("canvas");
  c.width = 256; c.height = 96;
  const g = c.getContext("2d");
  g.font = "bold 44px ui-sans-serif, system-ui, sans-serif";
  g.textAlign = "center";
  g.textBaseline = "middle";
  g.lineWidth = 8;
  g.strokeStyle = "rgba(0,0,0,0.6)";
  g.fillStyle = "#ffe08a";
  g.strokeText("+1 \u{1FAB5}", 128, 48);
  g.fillText("+1 \u{1FAB5}", 128, 48);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(26, 9.75, 1);
  sprite.position.set(x, 30, y);
  sprite.renderOrder = 998;
  floaterGroup.add(sprite);
  floaters.push({ sprite, mat, tex, life: 1.1, max: 1.1 });
}

function updateFx(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) {
      scene.remove(p.mesh);
      p.mat.dispose();
      particles.splice(i, 1);
      continue;
    }
    p.vz += 220 * dt;
    p.mesh.position.x += p.vx * dt;
    p.mesh.position.y += p.vy * dt;
    p.mesh.position.z += p.vz * dt;
    p.mesh.position.y = Math.max(0.5, p.mesh.position.y);
    p.vx *= 0.98;
    p.mesh.rotation.x = p.rot += p.vr * dt;
    p.mat.opacity = clamp(p.life / p.max, 0, 1);
  }
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.life -= dt;
    if (f.life <= 0) {
      floaterGroup.remove(f.sprite);
      f.mat.dispose();
      f.tex.dispose();
      floaters.splice(i, 1);
      continue;
    }
    f.sprite.position.y += 22 * dt;
    f.mat.opacity = clamp(f.life / f.max, 0, 1);
  }
}

// ------------------------------------------------------------------- input
const keys = {};
addEventListener("keydown", (e) => { keys[e.key.toLowerCase()] = true; });
addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });

let local = { x: 500, y: 350 };
let facing = 0;          // radians, 0 = facing +x in world space
let walkPhase = 0;
let room = null;
let myId = null;
let connected = false;

const raycaster = new THREE.Raycaster();
canvas.addEventListener("click", (e) => {
  if (!room || !room.state) return;
  const ndc = new THREE.Vector2(
    (e.clientX / window.innerWidth) * 2 - 1,
    -(e.clientY / window.innerHeight) * 2 + 1
  );
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects([...treeMeshes.values()], true);
  if (!hits.length) return;
  let o = hits[0].object;
  while (o && !o.userData.treeId) o = o.parent;
  const treeId = o ? o.userData.treeId : null;
  if (!treeId) return;
  const tree = room.state.trees.get(treeId);
  if (!tree) return;
  if (Math.hypot(tree.x - local.x, tree.y - local.y) <= 60) {
    room.send("harvest", { treeId });
  }
});

// ------------------------------------------------------------------ network
const proto = location.protocol === "https:" ? "wss" : "ws";
const endpoint = `${proto}://${location.host}`;
const client = new Colyseus.Client(endpoint);

async function connect() {
  try {
    room = await client.joinOrCreate("survival");
    myId = room.sessionId;
    connected = true;
    room.onStateChange.once((state) => {
      const me = state.players.get(myId);
      if (me) { local.x = me.x; local.y = me.y; }
    });
    room.onLeave(() => { connected = false; });
    setInterval(() => { if (room) room.send("move", { x: local.x, y: local.y }); }, 50);
  } catch (err) {
    console.error(err);
    statsEl.textContent = "Connection failed — see console";
  }
}

// --------------------------------------------------------------------- loop
const startTime = performance.now();
const DAY_LENGTH = 180000; // 3 minutes
const clock = new THREE.Clock();

const sunDay = new THREE.Color(0xfff2cf);
const sunDusk = new THREE.Color(0xffa860);
const sunNight = new THREE.Color(0x6a7ec0);
const skyDay = new THREE.Color(0x87b6d8);
const skyDusk = new THREE.Color(0xd98a52);
const skyNight = new THREE.Color(0x0a1230);
const tmpColor = new THREE.Color();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());
  const now = performance.now();
  const time = (now - startTime) / 1000;
  const tOfDay = (((now - startTime) / DAY_LENGTH) + 0.35) % 1;

  // ---- movement ----
  const speed = 170; // world units/sec
  let dx = 0, dy = 0;
  if (keys["w"] || keys["arrowup"]) dy -= 1;
  if (keys["s"] || keys["arrowdown"]) dy += 1;
  if (keys["a"] || keys["arrowleft"]) dx -= 1;
  if (keys["d"] || keys["arrowright"]) dx += 1;
  const moving = dx !== 0 || dy !== 0;
  if (moving) {
    const len = Math.hypot(dx, dy);
    dx /= len; dy /= len;
    local.x = clamp(local.x + dx * speed * dt, 20, W - 20);
    local.y = clamp(local.y + dy * speed * dt, 20, H - 20);
    facing = Math.atan2(dy, dx);
    walkPhase += dt * 11;
  }

  // ---- day / night ----
  const s = Math.sin(tOfDay * Math.PI * 2 - Math.PI / 2); // -1 midnight, +1 noon
  const dayAmt = clamp((s + 0.15) / 0.9, 0, 1);
  const warmth = 1 - Math.abs(s);

  sun.intensity = 0.3 + dayAmt * 2.4;
  sun.color.copy(sunNight).lerp(sunDay, dayAmt);
  if (warmth > 0.1) sun.color.lerp(sunDusk, warmth * 0.5);
  hemi.intensity = 0.3 + dayAmt * 0.75;

  tmpColor.copy(skyNight).lerp(skyDay, dayAmt);
  if (warmth > 0.1) tmpColor.lerp(skyDusk, warmth * 0.45);
  scene.background.copy(tmpColor);
  scene.fog.color.copy(tmpColor);

  // ---- camera: elevated tilted top-down rig ----
  const camTarget = new THREE.Vector3(local.x, 6, local.y);
  const camPos = new THREE.Vector3(
    local.x,
    CAM_HEIGHT,
    local.y + CAM_DIST
  );
  camera.position.lerp(camPos, 1 - Math.pow(0.0015, dt));
  camera.lookAt(camTarget);

  // Sun + shadow frustum follow the player
  sun.position.set(local.x + 260, 520, local.y + 180);
  sun.target.position.set(local.x, 0, local.y);
  sun.target.updateMatrixWorld();

  // ---- world ----
  if (room && room.state) {
    syncTrees(room.state, time);

    const seen = new Set();
    room.state.players.forEach((p, id) => {
      seen.add(id);
      const isMe = id === myId;
      let a = players.get(id);
      if (!a) { a = makePlayer(isMe); playerGroup.add(a.group); players.set(id, a); }

      let px, py, f, phase, mv;
      if (isMe) {
        px = local.x; py = local.y; f = facing; phase = walkPhase; mv = moving;
      } else {
        if (a.px === null) { a.px = p.x; a.py = p.y; }
        const moved = Math.hypot(p.x - a.px, p.y - a.py) > 0.4;
        if (moved) { a.facing = Math.atan2(p.y - a.py, p.x - a.px); a.phase += dt * 11; }
        a.moving = moved; a.px = p.x; a.py = p.y;
        px = p.x; py = p.y; f = a.facing; phase = a.phase; mv = a.moving;
      }

      a.group.position.set(px, 0, py);
      // World +x is scene +x; world +y is scene +z. The model faces scene +z,
      // so rotate so it points along the movement direction.
      a.group.rotation.y = Math.PI / 2 - f;

      const swing = mv ? Math.sin(phase) * 0.7 : 0;
      a.legL.rotation.x = swing;
      a.legR.rotation.x = -swing;
      a.armL.rotation.x = -swing * 0.8;
      a.armR.rotation.x = swing * 0.8;

      paintWoodLabel(a.woodLabel, p.wood);
      a.woodLabel.sprite.visible = true;
    });

    for (const [id, a] of players) {
      if (!seen.has(id)) {
        playerGroup.remove(a.group);
        disposeGroup(a.group);
        players.delete(id);
      }
    }
  } else {
    // Not connected yet: show the local survivor so the screen isn't empty.
    let a = players.get("__local__");
    if (!a) { a = makePlayer(true); playerGroup.add(a.group); players.set("__local__", a); }
    a.group.position.set(local.x, 0, local.y);
    a.group.rotation.y = Math.PI / 2 - facing;
    a.woodLabel.sprite.visible = false;
  }

  updateFx(dt);
  renderer.render(scene, camera);

  // ---- HUD ----
  if (connected && room && room.state) {
    const me = room.state.players.get(myId);
    const hours = Math.floor(tOfDay * 24);
    const mins = Math.floor((tOfDay * 24 * 60) % 60);
    const phaseName = tOfDay < 0.25 ? "\u{1F305} Dawn" : tOfDay < 0.5 ? "\u2600\uFE0F Day" : tOfDay < 0.75 ? "\u{1F307} Dusk" : "\u{1F319} Night";
    statsEl.innerHTML =
      `<div class="big">\u{1FAB5} ${me ? me.wood : 0} wood</div>` +
      `<div class="row"><span class="muted">Survivors</span><span><b>${room.state.players.size}</b></span></div>` +
      `<div class="row"><span class="muted">Trees left</span><span><b>${room.state.trees.size}</b></span></div>` +
      `<div class="row"><span class="muted">${phaseName}</span><span>${String(hours).padStart(2, "0")}:${String(mins).padStart(2, "0")}</span></div>`;
  }
}

resize();
animate();
connect();
</script>
</body>
</html>
